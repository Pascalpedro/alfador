<!doctype html>
<!--
  Static Netlify Forms definition for build-time detection.
  The live form is React-rendered on /contact; Netlify's form detection only
  scans static HTML at deploy time, so this hidden duplicate registers the
  "contact" form. Field names must match src/routes/contact.tsx exactly.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Form Definition</title>
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="full_name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <input type="text" name="area_of_interest" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
